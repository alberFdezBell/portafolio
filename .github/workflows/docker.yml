name: Build & Push Docker Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/alberfdezbell/portafolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notificar a Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Workflow:* ${{ github.workflow }}
            *Resultado:* ${{ job.status == 'success' && '✅ Éxito' || '❌ Fallo' }}
            *Rama:* `${{ github.ref_name }}`
            *Commit:* [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            *Autor:* ${{ github.actor }}

            [Ver detalles de la ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
